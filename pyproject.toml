[project]
name = "ls_equity_fund"
version = "0.1.0"
description = "Meridian Capital Partners — single-operator long/short US equity hedge fund system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Meridian Capital Partners" }]

dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<2.5",
    "scipy>=1.16,<1.18",
    "statsmodels>=0.14.6,<0.15",
    "ib-async>=2.1.0,<2.2",
    "edgartools>=5.30,<6",
    "yfinance==0.2.65",
    "curl-cffi>=0.7",
    "anthropic>=0.97,<1.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.2",
    "structlog>=25.5.0,<26",
    "typer>=0.15,<1.0",
    "alembic>=1.13,<2.0",
    "tenacity>=9.1,<10",
    "streamlit>=1.57,<2.0",
    "beautifulsoup4>=4.12,<5",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<2.0",
    "simfin>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=5,<7",
    "freezegun==1.5.5",
    "responses==0.26.0",
    "mypy==1.20.2",
    "ruff>=0.7,<1.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
meridian = "ls_equity_fund.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ls_equity_fund"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"src/ls_equity_fund/cli/**/*.py" = ["B008"]  # Typer requires typer.Option/Argument as defaults
"src/ls_equity_fund/cli/*.py" = ["B008"]
"src/ls_equity_fund/data/**/*.py" = ["RUF002"]  # math notation × ∪ in docstrings is intentional
"src/ls_equity_fund/dashboard/**/*.py" = ["RUF002"]  # math notation × in docstrings is intentional
"src/ls_equity_fund/analysis/**/*.py" = ["RUF002"]  # math notation × in docstrings is intentional
"src/ls_equity_fund/portfolio/**/*.py" = ["RUF001", "RUF002", "RUF003"]  # math symbols × − ∈ in docstrings
"tests/unit/portfolio/**/*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/analysis/**/*.py" = ["RUF002", "RUF003"]  # math notation × in test docstrings/comments
"src/ls_equity_fund/cli/portfolio_cmd.py" = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Per CONTEXT D-21: --strict only on src/risk/ and src/portfolio/ initially.
# Phase 0 sets up the config; strict surface grows as those packages do.
[[tool.mypy.overrides]]
module = ["ls_equity_fund.risk.*", "ls_equity_fund.portfolio.*"]
strict = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.3.0",
    "responses>=0.26.0",
    "types-requests>=2.33.0.20260503",
]
