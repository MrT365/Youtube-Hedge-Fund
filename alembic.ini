[alembic]
script_location = migrations

# We do NOT use sqlalchemy.url at runtime — env.py reads the path from
# ls_equity_fund.config (single source of truth for cache_dir). This URL is a
# stub that satisfies Alembic's parser when env.py's config-based override
# cannot resolve (e.g., running `alembic check` in a CI env without config.yaml).
sqlalchemy.url = sqlite:///./cache/ls_equity_fund.db

# Migration filename template — sequential numeric prefix + slugified message,
# e.g. `0001_create_runs_table.py`. Matches CONTEXT D-02's naming.
file_template = %%(rev)s_%%(slug)s

# UTC timestamps in revision-script Create Date (we don't autogenerate, but the
# template still emits a Create Date comment).
timezone = UTC

[post_write_hooks]
# Format newly-created revision scripts with ruff. Disabled by default — uncomment
# to enable. Kept off to avoid surprising operators with format-on-write.
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
